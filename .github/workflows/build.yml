name: Build fonts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Build
        run: python3 sources/build.py
      - name: Upload TTF
        uses: actions/upload-artifact@v4
        with:
          name: panj-type-ttf
          path: fonts/ttf/*.ttf
